## SMail 测试用邮箱凭据

# 支持多个 Profile：
#   - profile_smtp:  通过 SMTP 中继发送
#   - profile_selfsign: 通过 DKIM 自签名直投

# 本文件只用于 debugentry.java 进行测试，且已被加入 .gitignore ，可以放心编辑。

emails:
  profile_smtp:
    from: "your-email@example.com"
    from-who: "Your Name"
    reply-to: "reply@example.com"
    mode: "smtp"
    server: "smtp.example.com"
    port: 587
    username: "your-email@example.com"
    password: "your-password"
    # 如果配置了 OAuth Token，会自动忽略密码
    oauth-token: ""

  profile_selfsign:
    from: "postmaster@yourdomain.com"
    from-who: "Your Name"
    reply-to: "reply@yourdomain.com"
    mode: "selfsign"
    domain: "yourdomain.com"
    selector: "default"
    private_key: "/path/to/dkim-private.pem"
