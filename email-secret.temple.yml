## SMail 测试用邮箱凭据

# 支持多个 Profile：
#   - profile_smtp:  通过 SMTP 中继发送
#   - profile_selfsign: 通过 DKIM 自签名直投

# 将文件重命名为 email-scret.yml 以开始测试

test:
  # 收件者
  email_to: "bar@example.com"

emails:
  profile_smtp:
    from: 'foo@example.com'
    from-who: "Mr.Foo"
    reply-to: 'foo+reply@example.com'
    mode: "smtp"
    server: smtp.example.com
    port: 465
    username: foo@example.com
    password: "mr.foo's_password"
    # 如果配置了 OAuth Token，会自动忽略密码
    oauth-token: ""
    # 接受的连接超时时长（ms）
    timeout: 30000
    # 是否使用 TLS 确保安全连接
    tls: true

  profile_selfsign:
    from: "postmaster@yourdomain.com"
    from-who: "Mrs.Foo"
    reply-to: "reply@yourdomain.com"
    mode: "selfsign"
    domain: "yourdomain.com"
    selector: "default"
    private_key: "/path/to/dkim-private.pem"
